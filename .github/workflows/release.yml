name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # windows-2022 ships VS 2022 + v143 MFC (ATLMFC), matching PlatformToolset v143.
    # windows-latest is VS 2026 and hits MSB8041 for this static-MFC project.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Verify MFC libs
        shell: pwsh
        run: |
          $roots = @(
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC'
          ) | Where-Object { Test-Path $_ }
          $mfc = $null
          foreach ($root in $roots) {
            $mfc = Get-ChildItem -Path $root -Recurse -Filter 'nafxcw.lib' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($mfc) { break }
          }
          if (-not $mfc) {
            Write-Host 'nafxcw.lib not found; MSVC toolsets present:'
            foreach ($root in $roots) { Get-ChildItem $root -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name }
            throw 'MFC static libraries missing on runner'
          }
          Write-Host "Found: $($mfc.FullName)"

      - name: Build Release x64
        run: msbuild YtDlpMfc.sln /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      - name: Fetch runtime deps
        shell: pwsh
        run: .\scripts\fetch-deps.ps1 -OutDir dist\deps

      - name: Stage portable package
        shell: pwsh
        run: |
          $exe = 'bin\x64\Release\YtDlpMfc.exe'
          if (-not (Test-Path $exe)) { throw "Build output missing: $exe" }
          New-Item -ItemType Directory -Force -Path dist\app | Out-Null
          Copy-Item $exe dist\app\
          Copy-Item README.md dist\app\
          Move-Item dist\deps dist\app\deps
          Compress-Archive -Path dist\app\* -DestinationPath dist\yt-dlp-windows-win-x64.zip -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-windows-win-x64
          path: dist/yt-dlp-windows-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/yt-dlp-windows-win-x64.zip
